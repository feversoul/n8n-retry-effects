# Second overlay: the same tests with n8n in queue mode. The main process takes
# the webhooks and the retry requests, one worker runs the executions, and n8n
# stores everything in PostgreSQL.
#   npm run test:e2e:queue
x-queue-env: &queue-env
  N8N_ENCRYPTION_KEY: ${N8N_ENCRYPTION_KEY}
  EXECUTIONS_MODE: queue
  QUEUE_BULL_REDIS_HOST: redis
  DB_TYPE: postgresdb
  DB_POSTGRESDB_HOST: postgres
  DB_POSTGRESDB_DATABASE: n8n
  DB_POSTGRESDB_USER: n8n
  DB_POSTGRESDB_PASSWORD: test

services:
  n8n:
    environment: *queue-env
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1:5678/healthz"]
      interval: 3s
      timeout: 3s
      retries: 60

  worker:
    image: ${N8N_IMAGE:-n8nio/n8n:2.47.7}
    restart: "no"
    mem_limit: 1000m
    command: ["worker"]
    environment: *queue-env
    depends_on:
      n8n:
        condition: service_healthy

  postgres:
    image: postgres:17-alpine
    restart: "no"
    mem_limit: 512m
    environment:
      POSTGRES_USER: n8n
      POSTGRES_PASSWORD: test
      POSTGRES_DB: n8n
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U n8n -d n8n"]
      interval: 3s
      timeout: 3s
      retries: 40

  redis:
    image: redis:7-alpine
    restart: "no"
    mem_limit: 128m
